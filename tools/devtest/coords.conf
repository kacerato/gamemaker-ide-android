# --- Menu File (CALIBRAR) -------------------------------------------------------
# O devtest.sh tambem lista as linhas do menu aberto (screen.py rows) em file-menu-rows.txt
# para ajudar a calibrar. Linha de menu ~47 px a partir de y ~60 (chute).
