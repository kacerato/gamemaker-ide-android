# Coordenadas do roteiro tools/devtest (pixels da tela, 2772x1280 paisagem, POCO F7).
# Formato: NOME="x y". Comentarios com #. O devtest.sh le este arquivo com "source".
#
# Origem dos valores: estimados de logs/run14.png (IDE com escala 43% -> dpiFactor 2).
# Itens marcados CALIBRAR nao aparecem no run14.png e sao chute; a sessao principal deve
# ajustar depois de olhar os prints em logs/devtest/<data>/.
# Se a escala da UI mudar (dpi_override.json), TUDO aqui muda proporcionalmente.
#
# Onde possivel o devtest.sh prefere atalhos de teclado e o casamento de templates
# (templates/*.png, recortados do run14.png pelas linhas TPL_ abaixo). As coordenadas fixas
# so sao usadas quando o template nao casa (score < TPL_MIN_SCORE).

SCREEN_W=2772
SCREEN_H=1280

